<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G Chase: GPS Tag</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-functions.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background: #111; 
            color: white; 
            margin: 0; 
            padding: 10px; 
            overflow-x: hidden; 
        }
        #radar { 
            position: relative; 
            width: 320px; 
            height: 320px; 
            background: #222; 
            border-radius: 50%; 
            margin: 10px auto; 
            border: 3px solid #0a0; 
        }
        .player { 
            position: absolute; 
            transform: translate(-50%, -50%); 
            font-size: 20px; 
            filter: drop-shadow(0 0 2px black); 
        }
        #me { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            color: #0f0; 
            font-size: 28px; 
            z-index: 100; 
        }
        .controls { 
            margin: 15px; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 10px; 
        }
        button { 
            padding: 12px 20px; 
            border: none; 
            border-radius: 6px; 
            background: #333; 
            color: white; 
            font-size: 16px; 
            cursor: pointer; 
            min-width: 120px; 
        }
        .heading-btn { 
            background: #444; 
            font-size: 20px; 
            width: 60px; 
            min-width: unset; 
        }
        #status { 
            margin: 10px; 
            padding: 10px; 
            border-radius: 6px; 
            background: #333; 
            min-height: 20px; 
        }
        .hare { color: gold !important; }
        .hound { color: red !important; }
    </style>
</head>
<body>
    <h1>🔄 G Chase: GPS Tag</h1>
    <div id="status">Initializing...</div>
    <div id="radar">
        <!-- Current player (center) -->
        <div id="me"><i class="fas fa-location-arrow"></i></div>
        <!-- Other players rendered here -->
    </div>
    <div class="controls">
        <button id="leftBtn" class="heading-btn" title="Turn -30°"><i class="fas fa-undo"></i></button>
        <button id="modeBtn">GPS: OFF</button>
        <button id="rightBtn" class="heading-btn" title="Turn +30°"><i class="fas fa-redo"></i></button>
        <button id="speechBtn">🔇 Speech OFF</button>
    </div>
    <script>
        // === Configuration ===
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const functions = firebase.functions();

        // === Game State ===
        let myId = localStorage.getItem('playerId') || 'p_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('playerId', myId);
        let myHeading = 0; // North = 0 degrees
        let myRole = 'hound';
        let useRealGPS = false;
        let speechEnabled = false;
        let gpsWatchId = null;
        let simulationInterval = null;
        let lastSpeechTime = 0;
        let lastPlayers = [];

        // === DOM Elements ===
        const statusEl = document.getElementById('status');
        const radarEl = document.getElementById('radar');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const modeBtn = document.getElementById('modeBtn');
        const speechBtn = document.getElementById('speechBtn');

        // === Initialize ===
        updateStatus();
        startSimulatedHeading();
        startGameLoop();

        // === Event Listeners ===
        leftBtn.addEventListener('click', () => { myHeading -= 30; updateStatus(); });
        rightBtn.addEventListener('click', () => { myHeading += 30; updateStatus(); });
        modeBtn.addEventListener('click', toggleGPSMode);
        speechBtn.addEventListener('click', toggleSpeech);

        // === Core Functions ===
        function updateStatus() {
            myHeading = (myHeading + 360) % 360;
            statusEl.innerHTML = `ID: <b>${myId}</b> | Role: <b class="${myRole}">${myRole.toUpperCase()}</b> | Heading: <b>${Math.round(myHeading)}°</b>`;
            document.getElementById('me').style.transform = `translate(-50%, -50%) rotate(${myHeading}deg)`;
        }

        function toggleGPSMode() {
            useRealGPS = !useRealGPS;
            modeBtn.textContent = `GPS: ${useRealGPS ? 'ON' : 'OFF'}`;
            
            if (simulationInterval) {
                clearInterval(simulationInterval);
                simulationInterval = null;
            }
            if (gpsWatchId) {
                navigator.geolocation.clearWatch(gpsWatchId);
                gpsWatchId = null;
            }
            
            if (useRealGPS) {
                if (!navigator.geolocation) {
                    alert("Geolocation not supported!");
                    useRealGPS = false;
                    modeBtn.textContent = `GPS: OFF`;
                    startSimulatedHeading();
                    return;
                }
                gpsWatchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
                            myHeading = pos.coords.heading;
                            updateStatus();
                        }
                    },
                    (err) => {
                        console.error("GPS Error:", err);
                        startSimulatedHeading();
                    },
                    { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
                );
            } else {
                startSimulatedHeading();
            }
        }

        function startSimulatedHeading() {
            simulationInterval = setInterval(() => {
                myHeading += (Math.random() - 0.5) * 5;
                updateStatus();
            }, 2000);
        }

        function toggleSpeech() {
            speechEnabled = !speechEnabled;
            speechBtn.textContent = speechEnabled ? '🔊 Speech ON' : '🔇 Speech OFF';
            if (speechEnabled) {
                lastSpeechTime = 0;
                generateSpeech(lastPlayers);
            }
        }

        function startGameLoop() {
            setInterval(gameLoop, 1000);
        }

        async function gameLoop() {
            try {
                const updateGame = functions.httpsCallable('updateGame');
                const result = await updateGame({ 
                    playerId: myId, 
                    heading: myHeading 
                });
                
                const data = result.data;
                myRole = data.myRole;
                lastPlayers = data.players;
                updateStatus();
                renderRadar(data.players);
                
                if (speechEnabled && Date.now() - lastSpeechTime > 15000) {
                    generateSpeech(data.players);
                    lastSpeechTime = Date.now();
                }
            } catch (error) {
                console.error('Game loop error:', error);
                statusEl.innerHTML += '<br>Connection error';
            }
        }

        function renderRadar(players) {
            radarEl.querySelectorAll('.player:not(#me)').forEach(el => el.remove());
            const radarSize = 320;
            const scale = 8;
            
            players.forEach(p => {
                const x = (p.dx * scale) + radarSize/2;
                const y = (-p.dy * scale) + radarSize/2;
                
                const playerEl = document.createElement('div');
                playerEl.className = `player ${p.role}`;
                playerEl.style.left = `${x}px`;
                playerEl.style.top = `${y}px`;
                playerEl.innerHTML = `<i class="fas fa-location-arrow" style="transform: rotate(${p.heading}deg)"></i>`;
                radarEl.appendChild(playerEl);
            });
        }

        function generateSpeech(players) {
            if (players.length === 0) return;
            let speechText = `You are the ${myRole}. `;
            players.forEach(p => {
                const dist = Math.sqrt(p.dx*p.dx + p.dy*p.dy).toFixed(1);
                const bearing = (Math.atan2(p.dy, p.dx) * 180 / Math.PI + 450) % 360;
                const clock = Math.round(bearing / 30) || 12;
                speechText += `${p.role} at ${dist} units, ${clock} o'clock. `;
            });
            
            const utterance = new SpeechSynthesisUtterance(speechText);
            utterance.rate = 1.2;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>				<button id="geoBtn">Enable Geolocation</button>
				<button onclick="simulateGPS(0)">Face North</button>
				<button onclick="simulateGPS(90)">Face East</button>
				<button onclick="simulateGPS(180)">Face South</button>
				<button onclick="simulateGPS(270)">Face West</button>
				<button id="joinBtn">Join Game</button>
				<button onclick="resetGame()">Reset</button>
			</div>
		</div>
	</div>
	<div class="log" id="log"></div>

	<script>
		// Simple single-file location-like game using localStorage sync.
		const PLAYER_ID = 'player_' + Math.random().toString(36).slice(2, 11);
		const GRID_SIZE = 20;
		const CAPTURE_DIST = 1; // distance in grid units
		const TURN_TIME = 3000; // ms per turn (short for demo)

		let gameState = { turn: 0, updated: 0, players: [] };
		let myState = { id: PLAYER_ID, x: Math.random()*GRID_SIZE, y: Math.random()*GRID_SIZE, course: 0, role: 'hound', updated: Date.now()/1000 };
		let turnsAsHare = 0;

		const pidEl = document.getElementById('pid');
		const roleEl = document.getElementById('role');
		const posEl = document.getElementById('pos');
		const courseEl = document.getElementById('course');
		const turnEl = document.getElementById('turn');
		const survivedEl = document.getElementById('survived');
		const radar = document.getElementById('radar');
		const logEl = document.getElementById('log');
		const joinBtn = document.getElementById('joinBtn');

		pidEl.textContent = myState.id;

		function log(s){ const p = document.createElement('div'); p.textContent = s; logEl.prepend(p); }

		// localStorage key used to share game state for demo
		const STORAGE_KEY = 'course_chase_state_v1';

		function saveState(){
			gameState.updated = Date.now()/1000;
			localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
		}

		function loadState(){
			const raw = localStorage.getItem(STORAGE_KEY);
			if (!raw) return false;
			try{
				const js = JSON.parse(raw);
				if (js.updated && js.updated > gameState.updated) {
					gameState = js;
					return true;
				}
			}catch(e){ }
			return false;
		}

		function wrapCoord(v){ return ((v % GRID_SIZE)+GRID_SIZE)%GRID_SIZE; }

		function shortestVector(from,to){
			let dx = to.x - from.x; let dy = to.y - from.y;
			if (dx > GRID_SIZE/2) dx -= GRID_SIZE;
			if (dx < -GRID_SIZE/2) dx += GRID_SIZE;
			if (dy > GRID_SIZE/2) dy -= GRID_SIZE;
			if (dy < -GRID_SIZE/2) dy += GRID_SIZE;
			return {dx,dy};
		}

		function distance(a,b){ const v = shortestVector(a,b); return Math.sqrt(v.dx*v.dx + v.dy*v.dy); }

		function movePlayer(p){ const rad = p.course * Math.PI/180; p.x = wrapCoord(p.x + Math.sin(rad)); p.y = wrapCoord(p.y + Math.cos(rad)); }

		function checkCaptures(){
			const hare = gameState.players.find(p=>p.role==='hare');
			if (!hare) return null;
			for(const h of gameState.players){ if (h.role==='hound' && distance(h,hare)<=CAPTURE_DIST) return h; }
			return null;
		}

		function updateGameLogic(){
			gameState.players.forEach(movePlayer);
			const captor = checkCaptures();
			if (captor){
				captor.role = 'hare';
				const old = gameState.players.find(p=>p.id!==captor.id && p.role==='hare');
				if (old) old.role = 'hound';
				log(`🎯 CAPTURE! ${captor.id.slice(0,8)} is now the Hare`);
			}
			gameState.turn++;
			gameState.updated = Date.now()/1000;
			saveState();
		}

		function render(){
			// UI
			const me = gameState.players.find(p=>p.id===myState.id) || myState;
			roleEl.textContent = me.role.toUpperCase();
			posEl.textContent = `${me.x.toFixed(2)}, ${me.y.toFixed(2)}`;
			courseEl.textContent = `${Math.round(me.course)}°`;
			turnEl.textContent = gameState.turn;
			survivedEl.textContent = turnsAsHare;

			// radar
			radar.querySelectorAll('.blip').forEach(n=>n.remove());
			gameState.players.forEach(p=>{
				const el = document.createElement('div'); el.className = 'blip';
				if (p.role==='hare') el.classList.add('hare');
				if (p.id===myState.id) el.classList.add('me');
				// convert grid to radar coords (center = GRID_SIZE/2)
				const cx = (p.x / GRID_SIZE) * 100; const cy = (p.y / GRID_SIZE) * 100;
				el.style.left = cx + '%'; el.style.top = cy + '%';
				el.title = `${p.id.slice(0,8)} ${p.role}`;
				radar.appendChild(el);
			});
		}

		function joinGame(){
			// load latest state
			loadState();
			// ensure at least one hare
			if (!gameState.players || !Array.isArray(gameState.players)) gameState.players = [];
			if (!gameState.players.find(p=>p.role==='hare')){
				myState.role = 'hare';
			}
			// add me (or update)
			const existing = gameState.players.find(p=>p.id===myState.id);
			if (existing) Object.assign(existing,myState);
			else gameState.players.push(Object.assign({},myState));
			gameState.updated = Date.now()/1000;
			saveState();
			log('Joined game as ' + myState.id.slice(0,8));
			joinBtn.disabled = true;
		}

		function resetGame(){
			gameState = { turn: 0, updated: Date.now()/1000, players: [] };
			myState = { id: PLAYER_ID, x: Math.random()*GRID_SIZE, y: Math.random()*GRID_SIZE, course: 0, role: 'hound', updated: Date.now()/1000 };
			turnsAsHare = 0;
			saveState();
			log('Game reset');
			joinBtn.disabled = false;
			render();
		}

		// local update from storage changes (other windows)
		window.addEventListener('storage', (ev)=>{ if (ev.key===STORAGE_KEY) { loadState(); render(); } });

		// periodic tick
		setInterval(()=>{
			// sync from storage first
			loadState();
			// update myState timestamp and push to players list
			myState.updated = Date.now()/1000;
			const idx = gameState.players.findIndex(p=>p.id===myState.id);
			if (idx>=0) gameState.players[idx] = Object.assign({}, myState);
			// update roles count
			const me = gameState.players.find(p=>p.id===myState.id);
			if (me && me.role==='hare') turnsAsHare++;
			// run game logic each TURN_TIME
			const now = Date.now();
			if (!window._lastTick) window._lastTick = now;
			if (now - window._lastTick >= TURN_TIME){ updateGameLogic(); window._lastTick = now; }
			saveState(); render();
		}, 1000);

		// simple simulation controls
		function simulateGPS(deg){ myState.course = deg; log('Course set to ' + deg + '°'); render(); }

		// Geolocation support (course only, for demo)
		const geoBtn = document.getElementById('geoBtn');
		let watchId = null;
		geoBtn.addEventListener('click', ()=>{
			if (!navigator.geolocation) { alert('Geolocation not supported'); return; }
			if (watchId===null){
				watchId = navigator.geolocation.watchPosition(p=>{
					// if heading available, use it, otherwise derive from movement
					const coords = p.coords; if (coords.heading !== null) myState.course = coords.heading; 
					// map lat/lon roughly into grid for demo (not accurate)
					myState.x = wrapCoord((coords.longitude % 1 + 1) * GRID_SIZE);
					myState.y = wrapCoord((coords.latitude % 1 + 1) * GRID_SIZE);
					render();
				}, err=>{ log('Geolocation error: ' + err.message); }, { enableHighAccuracy: true });
				geoBtn.textContent = 'Disable Geolocation';
			} else {
				navigator.geolocation.clearWatch(watchId); watchId = null; geoBtn.textContent = 'Enable Geolocation';
			}
		});

		// initial load
		(function init(){
			const raw = localStorage.getItem(STORAGE_KEY);
			if (raw){ try{ gameState = JSON.parse(raw); }catch(e){ gameState = {turn:0,updated:Date.now()/1000,players:[]}; } }
			// ensure myState present in players array for local rendering until join
			const idx = gameState.players.findIndex(p=>p.id===myState.id);
			if (idx===-1) gameState.players.push(Object.assign({}, myState));
			render();
		})();

		// expose for buttons
		window.simulateGPS = simulateGPS;
		window.joinGame = joinGame;
		window.resetGame = resetGame;

	</script>
</body>
</html>
